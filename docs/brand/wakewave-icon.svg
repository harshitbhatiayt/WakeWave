<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sun" gradientUnits="userSpaceOnUse" x1="0" y1="180" x2="0" y2="640">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="0.45" stop-color="#FF8A1F"/>
      <stop offset="1" stop-color="#FF3B6B"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A1F"/>
      <stop offset="1" stop-color="#FF3B6B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#FF3B6B" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#7B5CFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#07060B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sky"><rect x="0" y="0" width="1024" height="640"/></clipPath>
    <clipPath id="tile"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="#07060B"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <g transform="translate(0 -56)">
    <!-- alarm-clock bells on the sun -->
    <g fill="url(#sun)">
      <path d="M-78 0 A78 78 0 0 1 78 0 Z" transform="translate(298 404) rotate(-42)"/>
      <path d="M-78 0 A78 78 0 0 1 78 0 Z" transform="translate(726 404) rotate(42)"/>
    </g>
    <!-- rising sun -->
    <circle cx="512" cy="640" r="290" fill="url(#sun)" clip-path="url(#sky)"/>
    <!-- sound bars rising out of the sun -->
    <g fill="#FFFFFF">
      <rect x="331" y="520" width="44" height="120" rx="22"/>
      <rect x="399" y="430" width="44" height="210" rx="22"/>
      <rect x="467" y="340" width="44" height="300" rx="22" opacity="0"/>
      <rect x="490" y="370" width="44" height="270" rx="22"/>
      <rect x="581" y="430" width="44" height="210" rx="22"/>
      <rect x="649" y="520" width="44" height="120" rx="22"/>
    </g>
    <!-- horizon -->
    <rect x="150" y="636" width="724" height="10" rx="5" fill="#FFFFFF"/>
    <!-- water waves below the horizon -->
    <g fill="none" stroke="url(#wave)" stroke-linecap="round">
      <path d="M210 712 q50 -28 100 0 t100 0 t100 0 t100 0 t100 0 t100 0" stroke-width="22" opacity="0.95"/>
      <path d="M270 782 q48 -26 96 0 t96 0 t96 0 t96 0 t96 0" stroke-width="20" opacity="0.65"/>
      <path d="M336 846 q44 -24 88 0 t88 0 t88 0 t88 0" stroke-width="18" opacity="0.38"/>
    </g>
  </g>
  </g>
</svg>
